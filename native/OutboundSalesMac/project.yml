name: OutboundSalesMac
options:
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: ko
  xcodeVersion: "26.6"
packages:
  OutboundSalesNative:
    path: ../OutboundSalesNative
targets:
  OutboundSalesMac:
    type: application
    platform: macOS
    sources:
      - path: OutboundSalesMac
        excludes:
          - Assets.xcassets
          - Info.plist
          - OutboundSalesMac.entitlements
    resources:
      - path: OutboundSalesMac/Assets.xcassets
    dependencies:
      - package: OutboundSalesNative
    configFiles:
      Debug: ../GoogleDriveOAuth.xcconfig
      Release: ../GoogleDriveOAuth.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: OutboundSalesMac/OutboundSalesMac.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 35PZ4DJ283
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        GOOGLE_DRIVE_REDIRECT_SCHEME: com.lucid47.outboundsales
        INFOPLIST_FILE: OutboundSalesMac/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.lucid47.outboundsales
        PRODUCT_NAME: OutboundSalesMac
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "6.0"
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
          ENABLE_TESTABILITY: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          VALIDATE_PRODUCT: YES
schemes:
  OutboundSalesMac:
    build:
      targets:
        OutboundSalesMac: all
    run:
      config: Debug
    archive:
      config: Release
